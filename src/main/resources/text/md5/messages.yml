usage:
  - "&7[ &aUsage of command &e/nodrop &7]"
  - "&7| &a/nodrop give [player] [item] (amount) &e- give no drop item"
  - "&7| &a/nodrop storage &e- open no drop items storage"
  - "&7| &a/nodrop giveStorage [player] [material] (amount) &e- Gives nodrop item to the player's personal storage"
  - "&7| &a/nodrop giveAllNoDrop [player] [material] (amount) &e- Gives allnodrop item to player"
  - "&7| &a/nodrop ignoreConfirm &e- Ignore confirm gui (only if confirm enabled)"
  - "&7| &a/nodrop ignoreConfirmTimed [seconds] &e- Timed ignore confirm gui (only if confirm enabled)"
  - "&7| &a/nodrop noIgnoreConfirm &e- Drop ignore confirm setting (only if confirm enabled)"
give:
  fail: "&4[!] &cFail! Check item type for valid."
  success: "&2&l[!] &aGived &e%item%&a to &e%player%&a amount &e%amount%&a!"
reload: "&aPlugin successfully reloaded at %time% ms"
applyHand:
  fail: "&4&l[!] &cFailed to apply no drop!"
  success: "&2&l[!] &aSuccessfully applied no drop status to your item!"
giveToStorage:
  fail: "&4[!] &cFail! Check item type for valid."
  success: "&2&l[!] &aGived &e%item%&a to &e%player%&a amount &e%amount%&a to storage!"
ignoreConfirm:
  on: "&2&l[!] &aNow you are ignore confirm menu!"
  off: "&2&l[!] &aNow you are not ignore confirm menu!"

noPerms: "&4&l[!] &cNo perms for this!"
noConsole: "&4&l[!] &cOnly players can use it!"
noExists: "&4&l[!] &cThis player doesnt exists!"
error: "&4&l[!] &cAn error occurred during the execution of the command!"

gui:
  confirm:
    title: "&lConfirm drop"
    yesButton:
      name: "&aYES"
      lore:
        - "&7Confirm throw no drop item"
      material: GREEN_WOOL
    noButton:
      name: "&cNO"
      lore:
        - "&7Cancel throw no drop item"
      material: RED_WOOL
  personalStorage:
    title: "&lPersonal storage"
    frame:
      name: "&7"
      material: GLASS_PANE
    prev:
      name: "&cPrevious"
      material: ARROW
    next:
      name: "&cNext"
      material: ARROW